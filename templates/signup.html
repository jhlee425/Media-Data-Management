<!DOCTYPE html>
<html>
<head>
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h2>회원 가입</h2>
        <form method="POST" action="{{ url_for('signup') }}">
            <div class="form-group">
                <label for="signup_username">Username:</label>
                <input type="text" class="form-control" id="signup_username" name="signup_username" required>
            </div>
            <div class="form-group">
                <label for="signup_password">Password:</label>
                <input type="password" class="form-control" id="signup_password" name="signup_password" required>
            </div>
            <button type="submit" class="btn btn-success">가입하기</button>
        </form>

        <p>이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인하기</a></p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul>
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
    </div>
</body>
</html>
